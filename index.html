<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>药品GSP仓储与质量管理系统 - 登录</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <div class="login-bg">
        <div class="login-card">
            <div class="login-head">
                <div class="login-logo"><i class="fa fa-medkit"></i></div>
                <h1 style="font-size:22px;font-weight:700">药品GSP仓储与质量管理系统</h1>
                <p style="color:rgba(255,255,255,0.8);margin-top:4px;font-size:13px">WMS · 质量 · 合规闭环管理解决方案</p>
            </div>
            <div class="login-body">
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="username"><i class="fa fa-user mr-1"></i>用户名</label>
                        <input type="text" id="username" class="input-field" placeholder="请输入用户名" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password"><i class="fa fa-lock mr-1"></i>密码</label>
                        <div class="relative">
                            <input type="password" id="password" class="input-field" placeholder="请输入密码" required autocomplete="current-password" style="padding-right:40px">
                            <button type="button" id="togglePassword" class="icon-btn absolute" style="right:8px;top:50%;transform:translateY(-50%)">
                                <i class="fa fa-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between mb-4">
                        <label class="checkbox-label"><input type="checkbox" id="remember" class="checkbox"> 记住我</label>
                        <span style="font-size:12px;color:var(--gray-400)">本地/AD 账号均可登录</span>
                    </div>
                    <div id="errorMessage" class="alert alert-error hidden"><i class="fa fa-exclamation-circle mr-2"></i><span id="errorText"></span></div>
                    <button type="submit" id="loginBtn" class="btn btn-primary w-full" style="justify-content:center;padding:10px">
                        <span>登录</span><i class="fa fa-sign-in ml-2"></i>
                    </button>
                </form>
            </div>
        </div>
        <div style="position:absolute;bottom:16px;width:100%;text-align:center;color:rgba(255,255,255,0.7);font-size:12px">
            &copy; 2026 药品GSP仓储与质量管理系统 · 仅供质量部门评审验证使用
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const API_BASE_URL = (window.WMS_CONFIG?.apiBaseUrl || '/api').replace(/\/+$/, '');
        const loginForm = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const loginBtn = document.getElementById('loginBtn');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });

        function extractDetail(detail) {
            if (!detail) return '用户名或密码错误';
            if (typeof detail === 'string') return detail;
            if (detail.message) return detail.message;
            if (Array.isArray(detail)) return detail.map(d => d.msg).join('；');
            return JSON.stringify(detail);
        }

        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = passwordInput.value;
            const remember = document.getElementById('remember').checked;
            errorMessage.classList.add('hidden');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>登录中...';
            try {
                const response = await fetch(API_BASE_URL + '/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ username, password })
                });
                let data = null;
                try { data = await response.json(); } catch (e) { /* ignore */ }
                if (!response.ok) throw new Error(extractDetail(data));
                const storage = remember ? localStorage : sessionStorage;
                storage.removeItem('access_token'); storage.removeItem('user'); storage.removeItem('token_expiry');
                storage.setItem('access_token', data.access_token);
                storage.setItem('user', JSON.stringify(data.user));
                if (data.expiry) storage.setItem('token_expiry', data.expiry);
                else if (remember) { const d = new Date(); d.setDate(d.getDate() + 7); storage.setItem('token_expiry', d.toISOString()); }
                window.location.href = 'dashboard.html';
            } catch (error) {
                errorText.textContent = error.message;
                errorMessage.classList.remove('hidden');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>登录</span><i class="fa fa-sign-in ml-2"></i>';
            }
        });

        // 已登录则直接进入
        (function () {
            const token = localStorage.getItem('access_token') || sessionStorage.getItem('access_token');
            if (token) {
                const expiry = localStorage.getItem('token_expiry') || sessionStorage.getItem('token_expiry');
                if (!expiry || new Date() < new Date(expiry)) window.location.href = 'dashboard.html';
            }
        })();
    </script>
</body>
</html>
